[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-supervisor-lab-finder"
version = "0.1.0"
description = "An evidence-based AI workflow for finding research supervisors and labs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "pydantic[email]",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"