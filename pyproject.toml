[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-finder"
version = "0.1.0"
description = "A LangGraph workflow for finding Australian university researchers by research topic."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-groq",
    "langchain-ollama",
    "pydantic",
    "pydantic-settings",
    "pycountry",
    "ddgs",
    "httpx",
    "beautifulsoup4",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_finder = [
    "data/universities/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"